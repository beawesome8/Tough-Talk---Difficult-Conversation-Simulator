services:
  - type: web
    name: tough-talk-backend
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: DAILY_BUDGET_CALLS
        value: "500"
      # fromService/property:host returns Render's *internal* hostname (for
      # Render-to-Render private networking), not the public URL a browser
      # can reach. Confirmed on the live deploy: the frontend bundle ended up
      # with the bare internal name "tough-talk-backend" instead of a usable
      # origin. Hardcoded to the real public URL instead.
      - key: ALLOWED_ORIGINS
        value: "https://tough-talk-frontend.onrender.com"
    healthCheckPath: /health

  - type: web
    name: tough-talk-frontend
    runtime: static
    staticPublishPath: frontend/dist
    buildCommand: cd frontend && npm install && npm run build
    envVars:
      # See the ALLOWED_ORIGINS comment above — fromService/host is an
      # internal hostname, not reachable from the browser. Hardcoded.
      - key: VITE_API_URL
        value: "https://tough-talk-backend.onrender.com"
